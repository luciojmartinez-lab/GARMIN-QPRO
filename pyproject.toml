[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-qpro"
version = "0.1.0"
description = "GARMIN-QPRO Python application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["garmin-fit-sdk>=21.208,<22"]

[project.optional-dependencies]
dev = ["pytest>=8"]
desktop = [
    "customtkinter>=5.2,<6",
    "garminconnect>=0.3.6,<0.4",
    "tkinterdnd2>=0.4.3,<1",
]
build = [
    "PyInstaller>=6,<7",
]
garmin = [
    "garminconnect>=0.3.6,<0.4",
]
mcp = [
    "mcp>=1.29,<2",
    "garminconnect>=0.3.6,<0.4",
]

[project.scripts]
garmin-qpro-mcp = "garmin_qpro.mcp_server.__main__:main"
garmin-qpro-desktop = "garmin_qpro.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
